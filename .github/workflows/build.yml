name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check scripts
        run: |
          bash -n build.sh scripts/render_readme.sh
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("Sources/MenuRemote/Resources/atv_bridge.py").read_text())'
      - name: Build app
        run: ./build.sh
      - name: Verify app bundle
        run: |
          plutil -lint build/MenuRemote.app/Contents/Info.plist
          codesign --verify --deep --strict build/MenuRemote.app
          test -x build/MenuRemote.app/Contents/MacOS/MenuRemote
          test -f build/MenuRemote.app/Contents/Resources/atv_bridge.py
          test -f build/MenuRemote.app/Contents/Resources/AppIcon.icns
